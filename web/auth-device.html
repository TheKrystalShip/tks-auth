<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="same-origin" />
    <meta name="color-scheme" content="dark light" />
    <title>Sign in a device · Auth</title>
  </head>
  <!-- tks-auth serves this document to a browser signed in here, at the address a device shows beside
       its code. The floor takes the code with no script at all and asks the provider, which shows the
       device it names and the choice; the application replaces it on mount. -->
  <body data-page="device">
    <div id="floor" class="k-cardscreen k-cardscreen--sm">
      <div class="k-cardscreen__inner">
        <div class="k-cardscreen__brand">
          <img class="k-cardscreen__mark" src="/assets/tks-mark.png" alt="" />
          <h1 class="k-cardscreen__wordmark">The Krystal Ship</h1>
          <div class="k-cardscreen__tagline">Sign in a device.</div>
        </div>
        <div class="k-cardscreen__card">
          <form class="signin-form" method="get" action="/device/confirm">
            <label class="k-field">
              <span class="k-field__label">Code</span>
              <input id="floor-code" class="k-input k-input--md k-input--mono k-input--wide" name="user_code" type="text"
                autocomplete="off" autocapitalize="characters" spellcheck="false" required />
            </label>
            <button type="submit" class="k-btn k-btn--primary k-btn--lg k-btn--wide">Continue</button>
          </form>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/pages/main.jsx"></script>
  </body>
</html>
