<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="same-origin" />
    <meta name="color-scheme" content="dark light" />
    <title>Sign in · Auth</title>
  </head>
  <!-- tks-auth serves this document for the request in flight, which lives behind a cookie, so
       nothing in it is particular to the request. The floor below is a working sign-in: it posts to
       the provider with no script at all, and the provider writes its links at the marker. The
       application replaces it on mount. -->
  <body data-page="sign-in">
    <div id="floor" class="k-cardscreen k-cardscreen--sm">
      <div class="k-cardscreen__inner">
        <div class="k-cardscreen__brand">
          <img class="k-cardscreen__mark" src="/assets/tks-mark.png" alt="" />
          <h1 class="k-cardscreen__wordmark">The Krystal Ship</h1>
          <div class="k-cardscreen__tagline">Sign in.</div>
        </div>
        <div class="k-cardscreen__card">
          <div class="floor-providers"><!--kgsm-floor-providers--></div>
          <form class="signin-form" method="post" action="/authorize/credentials">
            <label class="k-field">
              <span class="k-field__label">Username</span>
              <input id="floor-username" class="k-input k-input--md k-input--wide" name="username" type="text"
                autocomplete="username" autocapitalize="off" spellcheck="false" required />
            </label>
            <label class="k-field">
              <span class="k-field__label">Password</span>
              <input id="floor-password" class="k-input k-input--md k-input--wide" name="password" type="password"
                autocomplete="current-password" required />
            </label>
            <button type="submit" class="k-btn k-btn--primary k-btn--lg k-btn--wide">Sign in</button>
          </form>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/pages/main.jsx"></script>
  </body>
</html>
