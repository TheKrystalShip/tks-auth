# The provider's pages for Android phones, on the TKS shell (shell/, vendored from tks-shell;
# shell/build.sh says what each of these is). The app id is the one every install is made under, so
# it never changes. The site is the provider's issuer, ORIGIN in the untracked shell.local.conf beside
# this file, or --origin when there is none: this repository names no host.
APP_ID="com.thekrystalship.auth"
MARK="TksAuthApp"
ARTIFACT="tks-auth-app"
FEATURES=""
ORIGIN=""
if [[ -f "$app/shell.local.conf" ]]; then
  # shellcheck source=/dev/null
  source "$app/shell.local.conf"
fi
