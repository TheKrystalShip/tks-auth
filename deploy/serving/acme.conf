# The machine's plain-HTTP surface, installed by tks-auth-serve when the machine has none, since this
# provider's certificate is issued through it.
#
# Two jobs, and nothing else. It answers the ACME http-01 challenge so a certificate issued over the
# webroot renews without any service stopping, and it upgrades every other request to https. It is the
# DEFAULT server on :80 as well as the named one, so a request arriving with an unknown or absent Host
# still lands here and gets redirected rather than falling through to whichever vhost loaded first.

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # certbot --webroot writes the challenge file below this path.
    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    # 308, not 301: it preserves the method and body, so a bare-http POST upgrades to the identical https
    # POST instead of being silently retried as a GET.
    location / {
        return 308 https://$host$request_uri;
    }
}
